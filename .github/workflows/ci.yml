name: FinPilot AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop, Frontend]
  pull_request:
    branches: [main, Frontend]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: finpilot-ai-backend

jobs:
  # ──────────────────────────────────────
  # Stage 1: Lint & Type Check
  # ──────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: pip install ruff
      - name: Run Ruff linter
        run: ruff check backend/ --ignore E501,F401,F841 || true

  # ──────────────────────────────────────
  # Stage 2: Tests
  # ──────────────────────────────────────
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest anyio httpx email-validator
      - name: Run pytest
        run: python -m pytest backend/tests --tb=short
        env:
          PYTHONPATH: backend
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "test-secret-key-for-ci"
